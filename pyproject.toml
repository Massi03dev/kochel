[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kochel"
version = "0.1.0"
description = "Ultra-lightweight classical music metadata parser & entity linker based on ONNX and SQLite."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Massimiliano", email = "massyfederici@gmail.com"}
]
keywords = ["classical-music", "ner", "metadata", "onnx", "audio-tagging"]
dependencies = [
    "onnxruntime>=1.16.0",
    "tokenizers>=0.15.0",
    "numpy>=1.20.0",
    "gradio>=4.44.1",
]

[project.urls]
Homepage = "https://github.com/Massi03dev/kochel"
Repository = "https://github.com/Massi03dev/kochel"
Issues = "https://github.com/Massi03dev/kochel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kochel = [
    "models/*.onnx",
    "models/*.json",
    "data/*.sqlite"
]
